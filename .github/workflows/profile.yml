name: Profile cards

on:
  schedule:
    - cron: "17 4 * * *"   # daily refresh of stats
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "assets/*.json"
      - "assets/source/**"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Banner
        run: python scripts/banner.py

      - name: Skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      - name: Language radar
        run: python scripts/radar.py --data assets/languages.json -o assets/radar-langs --values

      # Optional: add a repository secret called METRICS_TOKEN (a classic PAT with
      # read:user) for the contribution tiles; otherwise the built-in token is used.
      - name: Stat, language and project cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py --user "${{ github.repository_owner }}"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push
